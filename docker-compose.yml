services:
  fuxi-web:
    build:
      context: .
    image: fuxi-web-console:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5177
      KB_PROJECT_ROOT: /data/ai-lib
      KB_ROOT: /data/ai-lib/knowledge-base
      BASIC_AUTH: ${BASIC_AUTH:-}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PUBLIC_PORT:-5177}:5177"
    volumes:
      - "${KB_ROOT_HOST:-../ai-lib/knowledge-base}:/data/ai-lib/knowledge-base:ro"
      - "./server/config:/app/server/config:ro"
